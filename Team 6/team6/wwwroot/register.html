<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Real Estate Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>

                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>

                    <a class="btn btn-light" href="login.html">
                        Login
                    </a>
                </div>

            </div>
        </nav>
    </header>


    <main class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Register
                        </h2>


                        <form id="registerForm">

                            <!-- Name -->
                            <div class="mb-3">

                                <label for="name"
                                       class="form-label">
                                    Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password"
                                       class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       required>

                            </div>


                            <!-- Role -->
                            <div class="mb-3">

                                <label for="role"
                                       class="form-label">
                                    Role
                                </label>

                                <select class="form-select"
                                        id="role"
                                        required>

                                    <option value="">
                                        Select Role
                                    </option>

                                    <option value="Client">
                                        Client
                                    </option>

                                    <option value="Agent">
                                        Agent
                                    </option>

                                    <option value="Admin">
                                        Admin
                                    </option>

                                </select>

                            </div>


                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Register
                            </button>

                        </form>


                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="login.html">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="/js/auth.js"></script>

</body>

</html>
