<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cities - Real Estate Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>

                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>
                </div>

            </div>
        </nav>
    </header>


    <main class="container mt-5">

        <h2 class="mb-4">City Management</h2>


        <!-- Add City Form -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">Add New City</h5>

                <form id="cityForm">

                    <div class="mb-3">
                        <label for="cityName" class="form-label">
                            City Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="cityName"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="state" class="form-label">
                            State
                        </label>

                        <input type="text"
                               class="form-control"
                               id="state"
                               required>
                    </div>


                    <button type="submit"
                            class="btn btn-primary"
                            id="submitButton">
                        Add City
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            id="cancelButton"
                            onclick="cancelEdit()"
                            style="display: none;">
                        Cancel
                    </button>

                </form>

            </div>

        </div>

        <!-- Filter and Sort -->
        <div class="card mb-4">
            <div class="card-body">

                <h5 class="card-title">Search and Sort</h5>

                <div class="row">

                    <div class="col-md-6 mb-2">
                        <input type="text"
                               class="form-control"
                               id="filterState"
                               placeholder="Enter state">
                    </div>

                    <div class="col-md-6 mb-2">

                        <button type="button"
                                class="btn btn-success"
                                onclick="filterCities()">
                            Filter by State
                        </button>

                        <button type="button"
                                class="btn btn-info"
                                onclick="sortCities()">
                            Sort by Name
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                onclick="loadCities()">
                            Show All
                        </button>

                    </div>

                </div>

            </div>
        </div>



        <!-- Cities Table -->
        <div class="card">

            <div class="card-body">

                <h5 class="card-title">Cities</h5>

                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>City Name</th>
                            <th>State</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="citiesTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <!-- City JavaScript -->
    <script src="js/city.js"></script>

    <nav>
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Real Estate Management
            </a>

            <div>
                <a class="btn btn-outline-light me-1"
                   href="index.html">
                    Home
                </a>

                <a class="btn btn-outline-light me-1"
                   href="users.html">
                    Users
                </a>

                <a class="btn btn-outline-light me-1"
                   href="agents.html">
                    Agents
                </a>

                <a class="btn btn-outline-light me-1"
                   href="cities.html">
                    Cities
                </a>

                <a class="btn btn-outline-light me-1"
                   href="amenities.html">
                    Amenities
                </a>
            </div>

        </div>
    </nav>

</body>

</html>
