<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - Real Estate Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>

                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>

                    <a class="btn btn-outline-light" href="cities.html">
                        Cities
                    </a>

                    <a class="btn btn-outline-light" href="amenities.html">
                        Amenities
                    </a>
                </div>

            </div>
        </nav>
    </header>


    <main class="container mt-5">

        <h2 class="mb-4">User Management</h2>


        <!-- Add / Update User -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title" id="formTitle">
                    Add New User
                </h5>

                <form id="userForm">

                    <!-- Name -->
                    <div class="mb-3">

                        <label for="userName"
                               class="form-label">
                            Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="userName"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="userEmail"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               id="userEmail"
                               required>

                    </div>


                    <!-- Password -->
                    <div class="mb-3"
                         id="passwordSection">

                        <label for="userPassword"
                               class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               id="userPassword"
                               required>

                    </div>


                    <!-- Role -->
                    <div class="mb-3"
                         id="roleSection">

                        <label for="userRole"
                               class="form-label">
                            Role
                        </label>

                        <select class="form-select"
                                id="userRole"
                                required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Client">
                                Client
                            </option>

                            <option value="Agent">
                                Agent
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                        </select>

                    </div>


                    <button type="submit"
                            class="btn btn-primary"
                            id="submitButton">
                        Add User
                    </button>


                    <button type="button"
                            class="btn btn-secondary"
                            id="cancelButton"
                            onclick="cancelEdit()"
                            style="display: none;">
                        Cancel
                    </button>

                </form>

            </div>

        </div>


        <!-- Find User -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Find User
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-2">

                        <input type="number"
                               class="form-control"
                               id="findUserId"
                               placeholder="Enter User ID">

                    </div>

                    <div class="col-md-6">

                        <button type="button"
                                class="btn btn-primary"
                                onclick="findUser()">
                            Find User
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Filter and Stats -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Filter and Statistics
                </h5>

                <div class="row">

                    <div class="col-md-4 mb-2">

                        <select class="form-select"
                                id="filterRole">

                            <option value="">
                                Select Role
                            </option>

                            <option value="Client">
                                Client
                            </option>

                            <option value="Agent">
                                Agent
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                        </select>

                    </div>


                    <div class="col-md-8 mb-2">

                        <button type="button"
                                class="btn btn-success"
                                onclick="filterUsers()">
                            Filter by Role
                        </button>

                        <button type="button"
                                class="btn btn-info"
                                onclick="showStats()">
                            Sort & Statistics
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                onclick="loadUsers()">
                            Show All
                        </button>

                    </div>

                </div>


                <!-- Statistics -->
                <div id="statistics"
                     class="mt-3">
                </div>

            </div>

        </div>


        <!-- Users Table -->
        <div class="card">

            <div class="card-body">

                <h5 class="card-title">
                    Users
                </h5>

                <table class="table table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="usersTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="/js/user.js"></script>

</body>

</html>
