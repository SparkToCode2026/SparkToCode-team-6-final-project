<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 15px;
            margin-top: 12px;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .edit {
            background: #f59e0b;
            color: white;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .cancel {
            background: #6b7280;
            color: white;
        }

        .payment {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

            .payment h3 {
                margin-top: 0;
            }

        .message {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #6b7280;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
        }

        .success {
            color: #16a34a;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
    
                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>
    
                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>
                </div>
    
            </div>
        </nav>
    </header>
    
    <div class="container">

        <h1>Payment History</h1>

        <div class="box">

            <h2 id="title">Create Payment</h2>

            <input type="hidden" id="paymentId">

            <label>Contract ID</label>
            <input type="number" id="contractId" min="1" value="1">

            <label>Amount</label>
            <input type="number" id="amount" min="0.01" step="0.01">

            <label>Payment Date</label>
            <input type="date" id="paymentDate">

            <label>Payment Method</label>
            <select id="method">
                <option value="">Select Method</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>

            <button class="save" id="saveButton">
                Create Payment
            </button>

            <button class="cancel hidden" id="cancelButton">
                Cancel
            </button>

            <div id="message"></div>

        </div>

        <h2>Payments</h2>

        <div id="payments">
            <div class="message">Loading payments...</div>
        </div>

    </div>

    <script>
    // @ts-nocheck

    const apiUrl = "/api/Payment";

    const $ = id => document.getElementById(id);

    async function loadPayments() {
        const container = $("payments");

        try {
            const response = await fetch(apiUrl);

            if (!response.ok) {
                throw new Error();
            }

            const payments = await response.json();

            if (!payments.length) {
                container.innerHTML =
                    '<div class="message">No payments found.</div>';
                return;
            }

            container.innerHTML = "";

            payments.forEach(payment => {

                const div = document.createElement("div");

                div.className = "payment";

                div.innerHTML = `
                    <h3>Payment #${payment.paymentId}</h3>

                    <p><strong>Contract ID:</strong>
                        ${payment.contractId}</p>

                    <p><strong>Amount:</strong>
                        ${Number(payment.amount).toFixed(2)}</p>

                    <p><strong>Payment Date:</strong>
                        ${formatDate(payment.paymentDate)}</p>

                    <p><strong>Method:</strong>
                        ${payment.method || "Not specified"}</p>

                    <button class="edit"
                        onclick="editPayment(${payment.paymentId})">
                        Edit
                    </button>

                    <button class="delete"
                        onclick="deletePayment(${payment.paymentId})">
                        Delete
                    </button>
                `;

                container.appendChild(div);
            });

        } catch (error) {
            console.error(error);

            container.innerHTML =
                '<div class="message error">Unable to load payments.</div>';
        }
    }

    async function createPayment() {

        const payment = {
            contractId: Number($("contractId").value),
            amount: Number($("amount").value),
            paymentDate: $("paymentDate").value,
            method: $("method").value
        };

        if (!payment.contractId ||
            !payment.amount ||
            payment.amount <= 0 ||
            !payment.paymentDate ||
            !payment.method) {

            showMessage(
                "Please complete all fields.",
                true
            );

            return;
        }

        try {

            const response = await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payment)
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            showMessage(
                "Payment created successfully.",
                false
            );

            clearForm();
            await loadPayments();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to create payment.",
                true
            );
        }
    }

    async function editPayment(id) {

        try {

            const response =
                await fetch(apiUrl + "/" + id);

            if (!response.ok) {
                throw new Error();
            }

            const payment =
                await response.json();

            $("paymentId").value =
                payment.paymentId;

            $("contractId").value =
                payment.contractId;

            $("amount").value =
                payment.amount;

            $("paymentDate").value =
                formatInputDate(payment.paymentDate);

            $("method").value =
                payment.method || "";

            $("title").textContent =
                "Edit Payment";

            $("saveButton").textContent =
                "Update Payment";

            $("cancelButton").classList.remove(
                "hidden"
            );

            window.scrollTo(0, 0);

        } catch (error) {

            alert("Unable to load payment.");
        }
    }

    async function updatePayment() {

        const id =
            Number($("paymentId").value);

        const payment = {
            paymentId: id,
            contractId: Number($("contractId").value),
            amount: Number($("amount").value),
            paymentDate: $("paymentDate").value,
            method: $("method").value
        };

        if (!id ||
            !payment.contractId ||
            !payment.amount ||
            payment.amount <= 0 ||
            !payment.paymentDate ||
            !payment.method) {

            showMessage(
                "Please complete all fields.",
                true
            );

            return;
        }

        try {

            const response = await fetch(
                apiUrl + "/" + id,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payment)
                }
            );

            if (!response.ok) {
                throw new Error(await response.text());
            }

            showMessage(
                "Payment updated successfully.",
                false
            );

            clearForm();
            await loadPayments();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to update payment.",
                true
            );
        }
    }

    async function deletePayment(id) {

        if (!confirm(
            "Are you sure you want to delete this payment?"
        )) {
            return;
        }

        try {

            const response =
                await fetch(apiUrl + "/" + id, {
                    method: "DELETE"
                });

            if (!response.ok) {
                throw new Error();
            }

            await loadPayments();

            alert("Payment deleted successfully.");

        } catch (error) {

            alert("Unable to delete payment.");
        }
    }

    function clearForm() {

        $("paymentId").value = "";
        $("contractId").value = "1";
        $("amount").value = "";
        $("paymentDate").value = "";
        $("method").value = "";

        $("title").textContent =
            "Create Payment";

        $("saveButton").textContent =
            "Create Payment";

        $("cancelButton").classList.add(
            "hidden"
        );
    }

    function showMessage(text, error) {

        const element = $("message");

        element.textContent = text;

        element.className =
            error ? "error" : "success";

        setTimeout(() => {
            element.textContent = "";
            element.className = "";
        }, 3000);
    }

    function formatDate(value) {

        if (!value) {
            return "Not available";
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleDateString();
    }

    function formatInputDate(value) {

        if (!value) {
            return "";
        }

        return String(value).substring(0, 10);
    }

    $("saveButton").addEventListener(
        "click",
        async function () {

            if ($("paymentId").value) {
                await updatePayment();
            } else {
                await createPayment();
            }
        }
    );

    $("cancelButton").addEventListener(
        "click",
        clearForm
    );

    document.addEventListener(
        "DOMContentLoaded",
        loadPayments
    );
    </script>

</body>
</html>
