<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Contracts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-box,
        .contract-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .status-btn {
            background: #16a34a;
            color: white;
        }

        .contract-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .contract-title {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 13px;
            font-weight: bold;
        }

        .contract-info {
            margin-top: 15px;
            color: #4b5563;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
            align-items: center;
        }

        .status-select {
            width: auto;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .contract-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .buttons button,
            .buttons select {
                width: 100%;
            }
        }
    </style>

</head>


<body>

<!-- Navbar -->
<header>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Real Estate Management
            </a>

            <div>
                <a class="btn btn-outline-light" href="index.html">
                    Home
                </a>
            </div>

        </div>
    </nav>
</header>

<div class="container">

    <h1>My Contracts</h1>

    <p class="subtitle">
        Create, view, update and manage your contracts.
    </p>


    <!-- =========================================
         CREATE / EDIT CONTRACT
    ========================================== -->

    <div class="form-box">

        <h2 id="formTitle">Create Contract</h2>

        <input type="hidden" id="contractId">

        <label for="listingId">
            Listing ID
        </label>

        <input type="number"
               id="listingId"
               min="1"
               value="1">


        <label for="userId">
            User ID
        </label>

        <input type="number"
               id="userId"
               min="1"
               value="1">


        <label for="signedDate">
            Signed Date
        </label>

        <input type="date"
               id="signedDate">


        <label for="status">
            Status
        </label>

        <select id="status">

            <option value="Pending">
                Pending
            </option>

            <option value="Signed">
                Signed
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>


        <button type="button"
                class="add-btn"
                id="createButton">
            Create Contract
        </button>

        <button type="button"
                class="cancel-btn"
                id="cancelButton"
                style="display: none;">
            Cancel
        </button>

    </div>


    <!-- =========================================
         CONTRACTS LIST
    ========================================== -->

    <h2>Contracts</h2>

    <div id="contractsContainer">

        <div class="message">
            Loading contracts...
        </div>

    </div>

</div>


<script>
    // @ts-nocheck

    // =========================================
    // API
    // =========================================

    const apiUrl = "/api/Contracts";


    // =========================================
    // GET ELEMENT
    // =========================================

    function getElement(id) {

        const element = document.getElementById(id);

        if (!element) {
            throw new Error("Element not found: " + id);
        }

        return element;
    }


    // =========================================
    // LOAD CONTRACTS
    // =========================================

    async function loadContracts() {

        const container =
            document.getElementById("contractsContainer");

        if (!container) {
            return;
        }

        container.innerHTML =
            '<div class="message">Loading contracts...</div>';


        try {

            const response =
                await fetch(apiUrl);


            if (!response.ok) {

                throw new Error(
                    "Failed to load contracts. Status: " +
                    response.status
                );

            }


            const contracts =
                await response.json();


            if (
                !Array.isArray(contracts) ||
                contracts.length === 0
            ) {

                container.innerHTML =
                    '<div class="message">' +
                    'No contracts found.' +
                    '</div>';

                return;
            }


            container.innerHTML = "";


            contracts.forEach(function (contract) {

                const card =
                    document.createElement("div");


                card.className =
                    "contract-card";


                const contractId =
                    Number(contract.contractId) || 0;


                const listingId =
                    Number(contract.listingId) || 0;


                const userId =
                    Number(contract.userId) || 0;


                const status =
                    contract.status || "Pending";


                const signedDate =
                    formatDate(contract.signedDate);


                card.innerHTML = `

                        <div class="contract-header">

                            <div class="contract-title">
                                Contract #${contractId}
                            </div>

                            <div class="status">
                                ${escapeHtml(String(status))}
                            </div>

                        </div>


                        <div class="contract-info">

                            <strong>Listing ID:</strong>
                            ${listingId}

                            <br>

                            <strong>User ID:</strong>
                            ${userId}

                            <br>

                            <strong>Signed Date:</strong>
                            ${escapeHtml(String(signedDate))}

                            <br>

                            <strong>Status:</strong>
                            ${escapeHtml(String(status))}

                        </div>

                        <div class="buttons">

                            <button
                                type="button"
                                class="edit-btn"
                                onclick="editContract(${contractId})"
                            >
                                Edit
                            </button>


                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteContract(${contractId})"
                            >
                                Delete
                            </button>

                        </div>
                        
                    `;


                container.appendChild(card);

            });

        }
        catch (error) {

            console.error(
                "Error loading contracts:",
                error
            );


            container.innerHTML =
                '<div class="message error">' +
                'Unable to load contracts.' +
                '</div>';
        }
    }


    // =========================================
    // CREATE OR UPDATE CONTRACT
    // =========================================

    async function createContract() {

        const contractIdValue =
            getElement("contractId").value;

        const isEditing =
            contractIdValue !== "";

        const listingId =
            Number(
                getElement("listingId").value
            );


        const userId =
            Number(
                getElement("userId").value
            );


        const signedDate =
            getElement("signedDate").value;


        const status =
            getElement("status").value;


        if (
            !listingId ||
            !userId ||
            !signedDate
        ) {

            alert(
                "Please enter Listing ID, User ID and Signed Date."
            );

            return;
        }


        const contract = {

            listingId: listingId,

            userId: userId,

            signedDate: signedDate,

            status: status

        };

        if (isEditing) {
            contract.contractId = Number(contractIdValue);
        }


        try {

            const response =
                await fetch(
                    isEditing ? (apiUrl + "/" + contractIdValue) : apiUrl,
                    {

                        method: isEditing ? "PUT" : "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(contract)

                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Failed to save contract."
                );
            }


            alert(
                isEditing
                    ? "Contract updated successfully."
                    : "Contract created successfully."
            );


            clearForm();

            await loadContracts();


        }
        catch (error) {

            console.error(
                "Error saving contract:",
                error
            );


            alert(
                "Unable to save contract: " + error.message
            );
        }
    }


    // =========================================
    // CLEAR / RESET FORM
    // =========================================

    function clearForm() {

        getElement("contractId").value = "";
        getElement("listingId").value = "1";
        getElement("userId").value = "1";
        getElement("signedDate").value = "";
        getElement("status").value = "Pending";

        getElement("formTitle").textContent = "Create Contract";
        getElement("createButton").textContent = "Create Contract";
        getElement("cancelButton").style.display = "none";
    }


    // =========================================
    // CHANGE STATUS (inline dropdown per card)
    // =========================================

    async function changeStatus(contractId) {

        const select =
            document.getElementById("status-select-" + contractId);

        const status = select.value;


        try {

            const url =
                apiUrl +
                "/" +
                contractId +
                "/status";


            const response =
                await fetch(
                    url,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(status)
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Failed to change status."
                );
            }


            alert(
                "Contract status updated successfully."
            );


            await loadContracts();

        }
        catch (error) {

            console.error(
                "Error changing status:",
                error
            );


            alert(
                "Unable to change contract status: " + error.message
            );
        }
    }


    // =========================================
    // EDIT CONTRACT (fills the top form)
    // =========================================

    async function editContract(contractId) {

        try {

            const getResponse =
                await fetch(
                    apiUrl +
                    "/" +
                    contractId
                );


            if (!getResponse.ok) {

                throw new Error(
                    "Contract not found."
                );
            }


            const contract =
                await getResponse.json();


            getElement("contractId").value = contractId;
            getElement("listingId").value = contract.listingId;
            getElement("userId").value = contract.userId;
            getElement("signedDate").value = formatDateForInput(contract.signedDate);
            getElement("status").value = contract.status;

            getElement("formTitle").textContent = "Edit Contract";
            getElement("createButton").textContent = "Update Contract";
            getElement("cancelButton").style.display = "inline-block";

            window.scrollTo({ top: 0, behavior: "smooth" });

        }
        catch (error) {

            console.error(
                "Error loading contract for edit:",
                error
            );


            alert(
                "Unable to load contract for editing."
            );
        }
    }


    // =========================================
    // DELETE CONTRACT
    // =========================================

    async function deleteContract(contractId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this contract?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    apiUrl +
                    "/" +
                    contractId,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Failed to delete contract."
                );
            }


            alert(
                "Contract deleted successfully."
            );


            await loadContracts();

        }
        catch (error) {

            console.error(
                "Error deleting contract:",
                error
            );


            alert(
                "Unable to delete contract."
            );
        }
    }


    // =========================================
    // FORMAT DATE
    // =========================================

    function formatDate(dateValue) {

        if (!dateValue) {
            return "Not available";
        }


        const date =
            new Date(dateValue);


        if (isNaN(date.getTime())) {
            return String(dateValue);
        }


        return date.toLocaleDateString();
    }


    // =========================================
    // FORMAT DATE FOR INPUT
    // =========================================

    function formatDateForInput(dateValue) {

        if (!dateValue) {
            return "";
        }


        const date =
            new Date(dateValue);


        if (isNaN(date.getTime())) {

            return String(dateValue)
                .substring(0, 10);
        }


        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                date.getDate()
            ).padStart(2, "0");


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );
    }


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");


        div.textContent =
            text;


        return div.innerHTML;
    }


    // =========================================
    // PAGE START
    // =========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const createButton =
                document.getElementById(
                    "createButton"
                );


            if (createButton) {

                createButton.addEventListener(
                    "click",
                    createContract
                );

            }


            const cancelButton =
                document.getElementById(
                    "cancelButton"
                );


            if (cancelButton) {

                cancelButton.addEventListener(
                    "click",
                    clearForm
                );

            }


            loadContracts();

        }
    );

</script>

</body>

</html>
