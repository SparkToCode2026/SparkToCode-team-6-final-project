<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Contracts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-box,
        .contract-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

            .form-box h2 {
                margin-top: 0;
            }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

            input:focus,
            select:focus {
                outline: none;
                border-color: #2563eb;
            }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
        }

            button:hover {
                opacity: 0.9;
            }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .status-btn {
            background: #16a34a;
            color: white;
        }

        .contract-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .contract-title {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 13px;
            font-weight: bold;
        }

        .contract-info {
            margin-top: 15px;
            color: #4b5563;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .contract-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons {
                flex-direction: column;
            }

                .buttons button {
                    width: 100%;
                }
        }
    </style>

</head>


<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
    
                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>
    
                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>
                </div>
    
            </div>
        </nav>
    </header>

    <div class="container">

        <h1>My Contracts</h1>

        <p class="subtitle">
            Create, view, update and manage your contracts.
        </p>


        <!-- =========================================
             CREATE CONTRACT
        ========================================== -->

        <div class="form-box">

            <h2>Create Contract</h2>


            <label for="listingId">
                Listing ID
            </label>

            <input type="number"
                   id="listingId"
                   min="1"
                   value="1">


            <label for="userId">
                User ID
            </label>

            <input type="number"
                   id="userId"
                   min="1"
                   value="1">


            <label for="signedDate">
                Signed Date
            </label>

            <input type="date"
                   id="signedDate">


            <label for="status">
                Status
            </label>

            <select id="status">

                <option value="Pending">
                    Pending
                </option>

                <option value="Active">
                    Active
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>


            <button type="button"
                    class="add-btn"
                    id="createButton">
                Create Contract
            </button>

        </div>


        <!-- =========================================
             CONTRACTS LIST
        ========================================== -->

        <h2>Contracts</h2>

        <div id="contractsContainer">

            <div class="message">
                Loading contracts...
            </div>

        </div>

    </div>


    <script>
        // @ts-nocheck

        // =========================================
        // API
        // =========================================

        const apiUrl = "/api/Contract";


        // =========================================
        // GET ELEMENT
        // =========================================

        function getElement(id) {

            const element = document.getElementById(id);

            if (!element) {
                throw new Error("Element not found: " + id);
            }

            return element;
        }


        // =========================================
        // LOAD CONTRACTS
        // =========================================

        async function loadContracts() {

            const container =
                document.getElementById("contractsContainer");

            if (!container) {
                return;
            }

            container.innerHTML =
                '<div class="message">Loading contracts...</div>';


            try {

                const response =
                    await fetch(apiUrl);


                if (!response.ok) {

                    throw new Error(
                        "Failed to load contracts. Status: " +
                        response.status
                    );

                }


                const contracts =
                    await response.json();


                if (
                    !Array.isArray(contracts) ||
                    contracts.length === 0
                ) {

                    container.innerHTML =
                        '<div class="message">' +
                        'No contracts found.' +
                        '</div>';

                    return;
                }


                container.innerHTML = "";


                contracts.forEach(function (contract) {

                    const card =
                        document.createElement("div");


                    card.className =
                        "contract-card";


                    const contractId =
                        Number(contract.contractId) || 0;


                    const listingId =
                        Number(contract.listingId) || 0;


                    const userId =
                        Number(contract.userId) || 0;


                    const status =
                        contract.status || "Pending";


                    const signedDate =
                        formatDate(contract.signedDate);


                    card.innerHTML = `

                        <div class="contract-header">

                            <div class="contract-title">
                                Contract #${contractId}
                            </div>

                            <div class="status">
                                ${escapeHtml(String(status))}
                            </div>

                        </div>


                        <div class="contract-info">

                            <strong>Listing ID:</strong>
                            ${listingId}

                            <br>

                            <strong>User ID:</strong>
                            ${userId}

                            <br>

                            <strong>Signed Date:</strong>
                            ${escapeHtml(String(signedDate))}

                            <br>

                            <strong>Status:</strong>
                            ${escapeHtml(String(status))}

                        </div>


                        <div class="buttons">

                            <button
                                type="button"
                                class="status-btn"
                                onclick="changeStatus(${contractId})"
                            >
                                Change Status
                            </button>


                            <button
                                type="button"
                                class="edit-btn"
                                onclick="editContract(${contractId})"
                            >
                                Edit
                            </button>


                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteContract(${contractId})"
                            >
                                Delete
                            </button>

                        </div>

                    `;


                    container.appendChild(card);

                });

            }
            catch (error) {

                console.error(
                    "Error loading contracts:",
                    error
                );


                container.innerHTML =
                    '<div class="message error">' +
                    'Unable to load contracts.' +
                    '</div>';
            }
        }


        // =========================================
        // CREATE CONTRACT
        // =========================================

        async function createContract() {

            const listingId =
                Number(
                    getElement("listingId").value
                );


            const userId =
                Number(
                    getElement("userId").value
                );


            const signedDate =
                getElement("signedDate").value;


            const status =
                getElement("status").value;


            if (
                !listingId ||
                !userId ||
                !signedDate
            ) {

                alert(
                    "Please enter Listing ID, User ID and Signed Date."
                );

                return;
            }


            const contract = {

                listingId: listingId,

                userId: userId,

                signedDate: signedDate,

                status: status

            };


            try {

                const response =
                    await fetch(
                        apiUrl,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(contract)

                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Failed to create contract."
                    );
                }


                alert(
                    "Contract created successfully."
                );


                await loadContracts();


            }
            catch (error) {

                console.error(
                    "Error creating contract:",
                    error
                );


                alert(
                    "Unable to create contract."
                );
            }
        }


        // =========================================
        // CHANGE STATUS
        // =========================================

        async function changeStatus(contractId) {

            const newStatus =
                prompt(
                    "Enter new status:",
                    "Active"
                );


            if (!newStatus) {
                return;
            }


            const status =
                newStatus.trim();


            if (!status) {
                return;
            }


            try {

                const url =
                    apiUrl +
                    "/" +
                    contractId +
                    "/status?status=" +
                    encodeURIComponent(status);


                const response =
                    await fetch(
                        url,
                        {
                            method: "PATCH"
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Failed to change status."
                    );
                }


                alert(
                    "Contract status updated successfully."
                );


                await loadContracts();

            }
            catch (error) {

                console.error(
                    "Error changing status:",
                    error
                );


                alert(
                    "Unable to change contract status."
                );
            }
        }


        // =========================================
        // EDIT CONTRACT
        // =========================================

        async function editContract(contractId) {

            try {

                // Get the existing contract first
                const getResponse =
                    await fetch(
                        apiUrl +
                        "/" +
                        contractId
                    );


                if (!getResponse.ok) {

                    throw new Error(
                        "Contract not found."
                    );
                }


                const contract =
                    await getResponse.json();


                // Ask for new values
                const listingId =
                    prompt(
                        "Enter Listing ID:",
                        contract.listingId || ""
                    );


                if (listingId === null) {
                    return;
                }


                const userId =
                    prompt(
                        "Enter User ID:",
                        contract.userId || ""
                    );


                if (userId === null) {
                    return;
                }


                const signedDate =
                    prompt(
                        "Enter Signed Date (YYYY-MM-DD):",
                        formatDateForInput(
                            contract.signedDate
                        )
                    );


                if (signedDate === null) {
                    return;
                }


                const status =
                    prompt(
                        "Enter Status:",
                        contract.status || "Pending"
                    );


                if (status === null) {
                    return;
                }


                if (
                    !Number(listingId) ||
                    !Number(userId) ||
                    !signedDate
                ) {

                    alert(
                        "Please enter valid contract information."
                    );

                    return;
                }


                const updatedContract = {

                    contractId:
                        contractId,

                    listingId:
                        Number(listingId),

                    userId:
                        Number(userId),

                    signedDate:
                        signedDate,

                    status:
                        status.trim()

                };


                const response =
                    await fetch(
                        apiUrl +
                        "/" +
                        contractId,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    updatedContract
                                )

                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Failed to update contract."
                    );
                }


                alert(
                    "Contract updated successfully."
                );


                await loadContracts();

            }
            catch (error) {

                console.error(
                    "Error updating contract:",
                    error
                );


                alert(
                    "Unable to update contract."
                );
            }
        }


        // =========================================
        // DELETE CONTRACT
        // =========================================

        async function deleteContract(contractId) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this contract?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        apiUrl +
                        "/" +
                        contractId,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText ||
                        "Failed to delete contract."
                    );
                }


                alert(
                    "Contract deleted successfully."
                );


                await loadContracts();

            }
            catch (error) {

                console.error(
                    "Error deleting contract:",
                    error
                );


                alert(
                    "Unable to delete contract."
                );
            }
        }


        // =========================================
        // FORMAT DATE
        // =========================================

        function formatDate(dateValue) {

            if (!dateValue) {
                return "Not available";
            }


            const date =
                new Date(dateValue);


            if (isNaN(date.getTime())) {
                return String(dateValue);
            }


            return date.toLocaleDateString();
        }


        // =========================================
        // FORMAT DATE FOR INPUT
        // =========================================

        function formatDateForInput(dateValue) {

            if (!dateValue) {
                return "";
            }


            const date =
                new Date(dateValue);


            if (isNaN(date.getTime())) {

                return String(dateValue)
                    .substring(0, 10);
            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );
        }


        // =========================================
        // ESCAPE HTML
        // =========================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");


            div.textContent =
                text;


            return div.innerHTML;
        }


        // =========================================
        // PAGE START
        // =========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const createButton =
                    document.getElementById(
                        "createButton"
                    );


                if (createButton) {

                    createButton.addEventListener(
                        "click",
                        createContract
                    );

                }


                loadContracts();

            }
        );

    </script>

</body>

</html>
