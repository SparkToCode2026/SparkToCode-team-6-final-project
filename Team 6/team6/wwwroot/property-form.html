<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PropTech — Property Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

    <div id="pt-navbar"></div>


    <main class="container py-4">

        <!-- Page Header -->

        <div class="pt-page-header mb-4">

            <p class="eyebrow mb-2">
                PROPERTY MANAGEMENT
            </p>

            <h1 id="page-title">
                New Property
            </h1>

            <p id="page-description">
                Add a new property to the system.
            </p>

        </div>


        <!-- Property Form -->

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="stub-card">

                    <div class="stub-body">

                        <form id="property-form">

                            <!-- Address -->

                            <div class="mb-4">

                                <label for="address"
                                       class="form-label">

                                    Property Address
                                    <span class="text-danger">*</span>

                                </label>

                                <input type="text"
                                       id="address"
                                       class="form-control"
                                       maxlength="200"
                                       placeholder="Enter property address"
                                       required>

                            </div>


                            <!-- Property Type + City -->

                            <div class="row g-3 mb-4">

                                <div class="col-md-6">

                                    <label for="propertyTypeId"
                                           class="form-label">

                                        Property Type
                                        <span class="text-danger">*</span>

                                    </label>

                                    <select id="propertyTypeId"
                                            class="form-select"
                                            required>

                                        <option value="">
                                            Select property type
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6">

                                    <label for="cityId"
                                           class="form-label">

                                        City
                                        <span class="text-danger">*</span>

                                    </label>

                                    <select id="cityId"
                                            class="form-select"
                                            required>

                                        <option value="">
                                            Select city
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- Bedrooms + Bathrooms + Square Footage -->

                            <div class="row g-3 mb-4">

                                <div class="col-md-4">

                                    <label for="bedrooms"
                                           class="form-label">

                                        Bedrooms
                                        <span class="text-danger">*</span>

                                    </label>

                                    <input type="number"
                                           id="bedrooms"
                                           class="form-control"
                                           min="0"
                                           required>

                                </div>


                                <div class="col-md-4">

                                    <label for="bathrooms"
                                           class="form-label">

                                        Bathrooms
                                        <span class="text-danger">*</span>

                                    </label>

                                    <input type="number"
                                           id="bathrooms"
                                           class="form-control"
                                           min="0"
                                           required>

                                </div>


                                <div class="col-md-4">

                                    <label for="squareFootage"
                                           class="form-label">

                                        Square Footage
                                        <span class="text-danger">*</span>

                                    </label>

                                    <input type="number"
                                           id="squareFootage"
                                           class="form-control"
                                           min="1"
                                           required>

                                </div>

                            </div>


                            <!-- Agent -->

                            <div class="mb-4">

                                <label for="agentId"
                                       class="form-label">

                                    Agent
                                    <span class="text-danger">*</span>

                                </label>

                                <select id="agentId"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select agent
                                    </option>

                                </select>

                                <div class="form-text">
                                    Only users with the Agent role can be assigned.
                                </div>

                            </div>


                            <!-- Description -->

                            <div class="mb-4">

                                <label for="description"
                                       class="form-label">

                                    Description

                                </label>

                                <textarea id="description"
                                          class="form-control"
                                          rows="5"
                                          maxlength="1000"
                                          placeholder="Describe the property..."></textarea>

                                <div class="form-text">
                                    Maximum 1000 characters.
                                </div>

                            </div>


                            <!-- Error Message -->

                            <div id="form-error"
                                 class="alert alert-danger d-none">
                            </div>


                            <!-- Buttons -->

                            <div class="d-flex justify-content-between gap-2">

                                <a href="/Properties.html"
                                   class="btn btn-outline-ink">

                                    Cancel

                                </a>


                                <button type="submit"
                                        id="save-button"
                                        class="btn btn-brick">

                                    Save Property

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/js/api.js"></script>

    <script src="/js/navbar.js"></script>

    <script src="/js/property-form.js"></script>

</body>
</html>
