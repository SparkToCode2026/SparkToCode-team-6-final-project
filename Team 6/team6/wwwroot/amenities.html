<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amenities - Real Estate Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    Real Estate Management
                </a>

                <div>
                    <a class="btn btn-outline-light" href="index.html">
                        Home
                    </a>

                    <a class="btn btn-outline-light" href="cities.html">
                        Cities
                    </a>
                </div>

            </div>
        </nav>
    </header>


    <main class="container mt-5">

        <h2 class="mb-4">Amenity Management</h2>


        <!-- Add / Update Amenity -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">Add New Amenity</h5>

                <form id="amenityForm">

                    <div class="mb-3">

                        <label for="amenityName"
                               class="form-label">
                            Amenity Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="amenityName"
                               required>

                    </div>


                    <button type="submit"
                            class="btn btn-primary"
                            id="submitButton">
                        Add Amenity
                    </button>


                    <button type="button"
                            class="btn btn-secondary"
                            id="cancelButton"
                            onclick="cancelEdit()"
                            style="display: none;">
                        Cancel
                    </button>

                </form>

            </div>

        </div>


        <!-- Search and Sort -->
        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">Search and Sort</h5>

                <div class="row">

                    <div class="col-md-6 mb-2">

                        <input type="text"
                               class="form-control"
                               id="filterName"
                               placeholder="Enter amenity name">

                    </div>


                    <div class="col-md-6 mb-2">

                        <button type="button"
                                class="btn btn-success"
                                onclick="filterAmenities()">
                            Filter by Name
                        </button>

                        <button type="button"
                                class="btn btn-info"
                                onclick="sortAmenities()">
                            Sort by Name
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                onclick="loadAmenities()">
                            Show All
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Amenities Table -->
        <div class="card">

            <div class="card-body">

                <h5 class="card-title">
                    Amenities
                </h5>

                <p id="totalAmenities"></p>

                <table class="table table-striped">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Amenity Name</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody id="amenitiesTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="/js/amenity.js"></script>


    <nav>
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Real Estate Management
            </a>

            <div>
                <a class="btn btn-outline-light me-1"
                   href="index.html">
                    Home
                </a>

                <a class="btn btn-outline-light me-1"
                   href="users.html">
                    Users
                </a>

                <a class="btn btn-outline-light me-1"
                   href="agents.html">
                    Agents
                </a>

                <a class="btn btn-outline-light me-1"
                   href="cities.html">
                    Cities
                </a>

                <a class="btn btn-outline-light me-1"
                   href="amenities.html">
                    Amenities
                </a>
            </div>

        </div>
    </nav>
</body>

</html>
